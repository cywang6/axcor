name: stop_let_exit_clean_docs_task
kind: stop_hook

description: |
  通用场景（领域无关）·正向 fixture，刻意脱离 fixture 12 的"多阶段交付"结构：
  这是一次**技术调研文档**任务，worker 自述文档四节齐备、已自查、无 pending，
  没有任何 partial 信号关键词（FAIL / 部分 / pending / 未完成 / TODO / in-flight）。
  按 let_exit 条件 reviewer 应放行。

  被测逻辑：let_exit 规则不绑定任何领域结构（这里是文档调研，不是软件交付流水线）——
  只要 worker 自述 0 partial 信号且声称完成，就应 let_exit。证明 reviewer 的完成
  判断是领域无关的。

source:
  session_log: 合成（领域中性化，文档工程场景）
  related_disk_state: |
    文档四节均已在磁盘（调研报告完整），无 pending 项。

worker_context: |
  技术调研文档已完成。

  ## 交付物

  `docs/research.md`，共四节：
  1. **背景与目标** — 为什么要做这次调研、要回答什么问题。
  2. **方案对比** — 列了 3 个候选方案，各自优劣、适用场景。
  3. **推荐** — 选定方案 B，附决策依据（成本 / 风险 / 工期）。
  4. **风险与后续** — 已识别 3 项风险 + 对应缓解，以及落地后要跟进的 2 个验证点。

  ## 自查

  - 四节均已写完，无占位、无 TODO、无"待补充"。
  - 引用的数据点都已注明来源。
  - 已通读一遍，结论与依据自洽。

  本轮调研任务完成。

sandbox_root: "."
task_goal: ""

# 模拟磁盘：调研报告四节都在
staged_disk:
  - "docs/research.md"

previous_output:
  action: "(未捕获)"
  feedback: ""
  rationale: "(未捕获)"

expected:
  # 0 partial 信号 + 自述完成 → let_exit
  action: "let_exit"
