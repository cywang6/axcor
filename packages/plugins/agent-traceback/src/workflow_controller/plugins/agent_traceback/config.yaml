name: agent_traceback
version: 0.1.0
# Plugin 加载即启用，每个 subagent stop 自动打文件态快照，支持检查点重放。
# 设为 false 则插件不被加载（无快照功能）。
enabled: false
# 检查点重放配置（进 PluginConfig.extra，插件 __init__ 读）。
# 快照默认由 config.yaml 的 enabled 控制——设为 true 则加载即启用。
snapshot_dir: .workflow-controller/snapshots
ignore: []
max_checkpoints: 200
# ── 内部 git 状态捕获（checkpoint 保真 workflow 自建的 .git 历史）──
# true：每个检查点把 project_dir/.git 整目录镜像进快照仓保留路径
# working/.workflow-controller-inner-git/（restore 后改回 .git，git log/status 与检查点时刻
# 一致）；false = 完全维持旧行为（逃生舱）。
snapshot_git_state: true
# 内部 .git 镜像体积上限（MB）。0 = 不限制；超限跳过捕获（标 skipped_size），
# 重放降级为复制 origin 当刻 .git 的旧行为。
snapshot_git_state_max_mb: 200
# 须远大于 git 本身耗时（<0.1s）：opencode 后台轮询器会对数 GB 级
# opencode.db 做同步全索引扫描，冷缓存时阻塞事件循环 1-2s，2s 旧值会
# 被吃光导致 status=timeout（无 git_ref 不可重放）。
snapshot_timeout_seconds: 30.0
# ── fork_root 孤儿目录 reaper（启动期兜底进程崩溃/重启残留的 ~2GB tempdir）──
# reaper_enabled: false 则完全关闭。
# reaper_max_age_days: tempdir mtime 超过此天数才删。默认 7 天，覆盖跨周崩溃恢复。
# reaper 仅启动期跑一次，且跳过仍被近期活动 session 引用的 fork_root。
reaper_enabled: true
reaper_max_age_days: 7
# ── 从 cannbot session db 文件重建会话 ──
# 入口：POST /api/sessions/import-db {db_path, target_cwd}
reconstruct:
  enabled: true
  # 每命令超时（秒）。正数：超时即 os.killpg 杀整树，best-effort 跳过（默认）。
  # null/0：无时间限制，命令跑到自然结束（最高保真）。orchestrator 将 null/0
  # 映射为 None，透传给 subprocess.communicate(timeout=None)。
  bash_timeout_seconds: 30
  # 全量重放：只读探查类（grep/ls/cat...）跳过，其余 mutating 命令重放，
  # 每命令超时。字段值固定为 `all`。
  bash_replay_mode: all
  # 回填 GIT_AUTHOR_DATE / GIT_AUTHOR_NAME 等，保 commit hash 一致
  git_hash_fidelity: true
  # 重放上限：tool_call 数超限只重放时间线前缀。0 = 不限制
  max_replay_tool_calls: 5000
  # source opencode.db 路径（schema 模板）。空 → 用宿主默认
  source_opencode_db: ""
