[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-controller-plugin-fake-driver"
version = "0.1.0"
description = "headless 验收驱动插件：注册 fake@1 run 驱动工厂，不接触任何 session 运行时"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Workflow Controller Contributors" }]
dependencies = ["workflow-controller-kernel"]

[project.entry-points."workflow_controller.plugins"]
fake_driver = "workflow_controller.plugins.fake_driver.plugin:FakeDriverPlugin"

[tool.uv.sources]
workflow-controller-kernel = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["workflow_controller*"]

[tool.setuptools.package-data]
"workflow_controller.plugins.fake_driver" = ["config.yaml"]
