[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-controller-plugin-staged-pipeline"
version = "0.1.0"
description = "阶段门禁执行器：确定性强制领域阶段顺序与完成门禁"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Workflow Controller Contributors" }]
dependencies = ["workflow-controller-kernel"]

[project.entry-points."workflow_controller.plugins"]
staged_pipeline = "workflow_controller.plugins.staged_pipeline.plugin:StagedPipelinePlugin"

[tool.uv.sources]
workflow-controller-kernel = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["workflow_controller*"]

[tool.setuptools.package-data]
"workflow_controller.plugins.staged_pipeline" = ["config.yaml"]
