[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-controller-hookserver"
version = "1.0.0"
description = "Standalone Claude Code / opencode hook server (zero deps beyond aiohttp)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Workflow Controller Contributors" }]
dependencies = ["aiohttp>=3.9"]

[project.scripts]
workflow-controller-hookserver = "workflow_controller_hookserver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
