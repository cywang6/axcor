runtime: opencode
starting_prompt: |
  任务：按三阶段（设计 → 开发 → 测试）交付 add 的 impl.py + test.py。
  一气走完三阶段再收尾写 summary.md，中途不要停下汇报、不要等指令、不要在中途产生无 tool 调用的结束回合。

  阶段零（清理）：开工第一件事——用 bash 工具运行 `./clean.sh`，清除上一次运行遗留的产物
  （design_api.md / design_impl.md / impl.py / test.py / summary.md），确保本次从干净状态开始。
  clean.sh 跑完再进入阶段一。

  阶段一（设计，并发）：在同一条 assistant 消息里用 task 工具发出两条调用，并发派出两个设计
  subagent，并等待两条都返回（阶段一完成 = 两个设计 subagent 都已返回）：
    - designer_api（subagent_type: designer_api）写 design_api.md（含 add(a,b)->a+b）。
    - designer_impl（subagent_type: designer_impl）写 design_impl.md（含 return a+b）。

  阶段二（开发）：前置条件——design_api.md 与 design_impl.md 都已落盘、且两个设计 subagent
  都已返回，才能开始。用 task 工具起 developer（subagent_type: developer）读两份 design
  实现 impl.py。两者未齐前不要提前起 developer。

  阶段三（测试）：用 task 工具起 tester（subagent_type: tester），读 impl.py 写 test.py 并自测。
  收到 tester 完成摘要后，写 summary.md 汇总（文件 / 自测结果）。

  【反循环约束】
  - 每个文件只写一次。若 design_api.md / design_impl.md 已存在且内容正确，不要再派对应
    designer，直接进入下一阶段；不要回退重派已完成的 subagent。
  - 不要在阶段一/二之间插入“阶段一已完成，等待指示”之类的回合——继续推进到 summary.md。
reviewer:
  enabled: true
  model: ''
  task_goal: |
    交付 design_api.md + design_impl.md + impl.py + test.py + summary.md。
  timeout_seconds: 300
model: ''
system_prompt: ''
loop:
  evaluator: null
  max_iterations: 10
